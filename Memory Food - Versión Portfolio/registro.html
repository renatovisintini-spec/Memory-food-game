<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Registro de jugador en Memory Food.">
  <title>Registrarse | Memory Food</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Memory Food</a>
    <nav class="nav" aria-label="Navegación principal">
      <a href="login.html">Iniciar sesión</a>
    </nav>
  </header>

  <main class="shell page-center">
    <section class="panel auth-panel" aria-labelledby="register-title">
      <div class="panel__heading">
        <p class="eyebrow">Crear jugador</p>
        <h1 id="register-title">Registrarse</h1>
        <p>Completa tus datos para guardar tus mejores partidas en este navegador.</p>
      </div>

      <form id="register-form" class="form" novalidate>
        <div class="form-field">
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" autocomplete="name" required minlength="2">
          <small class="field-error" data-error-for="name"></small>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="city">Ciudad</label>
            <input id="city" name="city" type="text" autocomplete="address-level2" required>
            <small class="field-error" data-error-for="city"></small>
          </div>
          <div class="form-field">
            <label for="country">País</label>
            <input id="country" name="country" type="text" autocomplete="country-name" required>
            <small class="field-error" data-error-for="country"></small>
          </div>
        </div>

        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <small class="field-error" data-error-for="email"></small>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="password">Contraseña</label>
            <div class="password-field">
              <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6">
              <button class="icon-button" type="button" data-toggle-password="password" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
            <small class="field-error" data-error-for="password"></small>
          </div>

          <div class="form-field">
            <label for="confirm-password">Repetir contraseña</label>
            <div class="password-field">
              <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="6">
              <button class="icon-button" type="button" data-toggle-password="confirm-password" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
            <small class="field-error" data-error-for="confirm-password"></small>
          </div>
        </div>

        <div id="form-message" class="form-message" role="status" aria-live="polite"></div>
        <button class="button button--full" type="submit">Crear cuenta</button>
      </form>

      <p class="auth-switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>.</p>
    </section>
  </main>

  <script type="module" src="js/registro.js"></script>
</body>
</html>
