<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Inicio de sesión en Memory Food.">
  <title>Iniciar sesión | Memory Food</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Memory Food</a>
    <nav class="nav" aria-label="Navegación principal">
      <a href="registro.html">Registrarse</a>
    </nav>
  </header>

  <main class="shell page-center">
    <section class="panel auth-panel auth-panel--narrow" aria-labelledby="login-title">
      <div class="panel__heading">
        <p class="eyebrow">Bienvenido</p>
        <h1 id="login-title">Iniciar sesión</h1>
        <p>Accede con una cuenta registrada en este navegador.</p>
      </div>

      <form id="login-form" class="form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <small class="field-error" data-error-for="email"></small>
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="icon-button" type="button" data-toggle-password="password" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
          <small class="field-error" data-error-for="password"></small>
        </div>

        <div id="form-message" class="form-message" role="status" aria-live="polite"></div>
        <button class="button button--full" type="submit">Entrar y jugar</button>
      </form>

      <p class="auth-switch">¿No tienes cuenta? <a href="registro.html">Regístrate</a>.</p>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
